<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PeteZah Portal</title>

  <meta
    name="description"
    content="PeteZah Games Portal"
  >

  <style>
    /* ------------------------------ */
    /* BASIC PAGE SETTINGS             */
    /* ------------------------------ */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020810;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* ------------------------------ */
    /* MAIN PORTAL                     */
    /* ------------------------------ */

    .portal {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #020810;
    }


    /* ------------------------------ */
    /* TOP BAR                         */
    /* ------------------------------ */

    .topbar {
      width: 100%;
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 10px 20px;

      background: #0b1220;
      border-bottom: 2px solid #1e293b;

      color: white;
      z-index: 10;
    }


    /* LEFT SIDE OF TOP BAR */

    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 32px;
    }

    .title {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
    }

    .subtitle {
      margin: 2px 0 0;
      font-size: 12px;
      color: #94a3b8;
    }


    /* ------------------------------ */
    /* BUTTONS                         */
    /* ------------------------------ */

    .buttons {
      display: flex;
      gap: 8px;
    }

    .button {
      border: none;
      border-radius: 8px;

      padding: 10px 15px;

      background: #1e293b;
      color: white;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.2s;
    }

    .button:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }


    /* ------------------------------ */
    /* PETEZAH AREA                    */
    /* ------------------------------ */

    .game-area {
      position: relative;

      width: 100%;
      height: calc(100vh - 70px);

      background: #000;
    }


    /* ------------------------------ */
    /* IFRAME                          */
    /* ------------------------------ */

    #petezahFrame {
      width: 100%;
      height: 100%;

      border: none;

      display: block;

      background: #000;
    }


    /* ------------------------------ */
    /* LOADING MESSAGE                 */
    /* ------------------------------ */

    .loading {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      color: white;

      font-size: 18px;
      text-align: center;

      pointer-events: none;

      z-index: 1;
    }


    /* ------------------------------ */
    /* MOBILE                          */
    /* ------------------------------ */

    @media (max-width: 600px) {

      .topbar {
        min-height: 60px;
        padding: 8px 12px;
      }

      .logo {
        font-size: 24px;
      }

      .title {
        font-size: 17px;
      }

      .subtitle {
        display: none;
      }

      .button {
        padding: 8px 10px;
        font-size: 12px;
      }

      .game-area {
        height: calc(100vh - 60px);
      }
    }
  </style>
</head>


<body>

  <!-- ================================= -->
  <!-- MAIN PORTAL                       -->
  <!-- ================================= -->

  <div class="portal">


    <!-- ================================= -->
    <!-- TOP BAR                           -->
    <!-- ================================= -->

    <header class="topbar">

      <div class="title-area">

        <div class="logo">
          🎮
        </div>

        <div>
          <h1 class="title">
            PeteZah Portal
          </h1>

          <p class="subtitle">
            GitHub-powered game portal
          </p>
        </div>

      </div>


      <!-- ================================= -->
      <!-- BUTTONS                           -->
      <!-- ================================= -->

      <div class="buttons">

        <!-- Reload PeteZah -->

        <button
          class="button"
          onclick="reloadPeteZah()"
        >
          🔄 Reload
        </button>


        <!-- Fullscreen -->

        <button
          class="button"
          onclick="fullscreenPeteZah()"
        >
          ⛶ Fullscreen
        </button>

      </div>

    </header>


    <!-- ================================= -->
    <!-- GAME AREA                          -->
    <!-- ================================= -->

    <main class="game-area">

      <!-- Loading text -->

      <div
        class="loading"
        id="loading"
      >
        Loading PeteZah...
      </div>


      <!-- ================================= -->
      <!-- PETEZAH                            -->
      <!-- ================================= -->

      <iframe
        id="petezahFrame"

        src="https://petezahgames.com/"

        title="PeteZah Games"

        allowfullscreen

        loading="eager"

        referrerpolicy="no-referrer"
      ></iframe>

    </main>

  </div>


  <!-- ================================= -->
  <!-- JAVASCRIPT                        -->
  <!-- ================================= -->

  <script>

    /*
     * Get the PeteZah iframe.
     */

    const petezahFrame =
      document.getElementById("petezahFrame");


    /*
     * Get the loading message.
     */

    const loading =
      document.getElementById("loading");


    /*
     * When PeteZah finishes loading,
     * hide the loading message.
     */

    petezahFrame.addEventListener(
      "load",
      function () {

        loading.style.display = "none";

      }
    );


    /*
     * Reload PeteZah.
     */

    function reloadPeteZah() {

      loading.style.display = "block";

      petezahFrame.src =
        petezahFrame.src;

    }


    /*
     * Put the PeteZah iframe into fullscreen.
     */

    function fullscreenPeteZah() {

      if (petezahFrame.requestFullscreen) {

        petezahFrame.requestFullscreen();

      }

      else if (petezahFrame.webkitRequestFullscreen) {

        petezahFrame.webkitRequestFullscreen();

      }

      else {

        alert(
          "Fullscreen isn't supported by this browser."
        );

      }

    }

  </script>

</body>
</html>
